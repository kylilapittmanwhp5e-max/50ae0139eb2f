          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hevc_tiles -j2
      - run:
          name: Encode with tiles
          command: LIONSS_LP=1 ./build/hevc_tiles --in hevc.yuv --tiles 2x2
